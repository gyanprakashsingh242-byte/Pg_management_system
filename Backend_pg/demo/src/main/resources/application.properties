# Server Port
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://mysql-2f04f5d7-living-peace-db.i.aivencloud.com:19565/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD:AVN_SECRET_PLACEHOLDER}
